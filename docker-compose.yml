name: learning-backlog

services:
  # Static web server for the local copy of the PWA.
  # Accessible at http://localhost:8080 once `docker compose up -d` is running.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

  # Cron container. Runs recall generation/grading and the weekly curator.
  # Mounts ./frontend read-write so the curator can update the SEED in place.
  cron:
    build: ./cron
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./frontend:/app/frontend           # curator writes SEED here
      - ./cron:/app/cron                    # mounted for easy iteration; remove for prod
      - /app/cron/node_modules              # keep image-built deps from being shadowed by the bind mount above
      - ./data:/app/data:ro                 # one-shot inputs (e.g. X archive bookmarks.js)
      - ./concepts:/app/concepts           # analyze_bookmarks.js synthesis pass writes .md insights here
    init: true

volumes:
  caddy_data:
  caddy_config:
